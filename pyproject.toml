[project]
name = "library-management-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.2",
    "django-crispy-forms==2.7",
    "crispy-bootstrap5==2026.9",
    "dj-database-url>=2.2,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.8,<7",
]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
