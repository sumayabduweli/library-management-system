databases:
  - name: library-management-db
    plan: free
    databaseName: library_management
    user: library_management

services:
  - type: web
    name: library-management-system
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn books.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
