{% extends './base.html' %}
{% load crispy_forms_tags %}
{% block title %}Edit Book{% endblock %}
{% block content %}
<main>
        <h1>Edit Book</h1>
        {% if message %}<p>{{ message }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            {{ book_form|crispy }}
            <button type="submit" class="btn btn-primary">Save Changes</button>
            {% if message %}
                <p>{{ message }}</p>
            {% endif %}
        </form>
        <p><a href="{% url 'add_book_page' %}">Back to books</a></p>
    </main>
{% endblock %}
